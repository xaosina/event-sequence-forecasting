trainer:
  total_iters: 1_000_000
  total_epochs: null
  ckpt_track_metric: 'loss'
  iters_per_epoch: null
  patience: 20
  profiling: false
  verbose: True
  ckpt_resume: null
  val_loss_resamples: 3

evaluator:
  metrics:
    - OTD
    - OTD: {focus_on: [time_since_start]}
    - OTD: {focus_on: [type_event]}
    - OTD: {max_shift: 0, focus_on: [time_since_start]}
    - OTD: {max_shift: 0, focus_on: [type_event]}
    - Cardinality

data_conf:
  dataset_name: amazon
  cat_cardinalities:
    - ["type_event", 16]
  index_name: seq_idx
  time_name: time_since_start
  focus_on:
  target_token: "type_event"

  test_path: 'data/amazon/test'
  train_path: 'data/amazon/train'
  val_ratio: 0.15
  num_workers: 4
  train_resamples: 1
  val_resamples: 3
  batch_size: 128

  min_history_len: 4
  generation_len: 4
  max_seq_len: 94

  padding_value: 0

  train_random_end: index
  val_random_end: index

  train_transforms:
    "time_diff":
      TimeToDiff:
        disable: True
    "log_tfs": null
    "vr_decimal": null
    "3":
      CutTargetSequence:
        target_len: 0

  val_transforms:
    "time_diff": ${data_conf.train_transforms.time_diff}
    "log_tfs": ${data_conf.train_transforms.log_tfs}
    "vr_decimal": ${data_conf.train_transforms.vr_decimal}
    "3":
      CutTargetSequence:
        target_len: ${data_conf.generation_len}
