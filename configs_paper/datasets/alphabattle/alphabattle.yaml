trainer:
  total_iters: 1_000_000
  total_epochs: null
  ckpt_track_metric: 'loss'
  iters_per_epoch: null
  patience: 10
  profiling: false
  verbose: True
  ckpt_resume: null

evaluator:
  metrics:
    - OTD
    - OTD: {focus_on: [amnt]}
    - OTD: {focus_on: [hours_since_first_tx]}
    - OTD: {focus_on: [mcc_category]}
    - OTD: {max_shift: 0, focus_on: [amnt]}
    - OTD: {max_shift: 0, focus_on: [hours_since_first_tx]}
    - OTD: {max_shift: 0, focus_on: [mcc_category]}
    - Cardinality

data_conf:
  dataset_name: alphabattle
  cat_cardinalities:
    - ["mcc_category", 28]
    - ["mcc", 109]
    - ["payment_system", 7]
    - ["card_type", 166]
  num_names:
    - amnt
  index_name: app_id
  time_name: hours_since_first_tx
  focus_on:
  target_token: "mcc_category"
  amount_feature: "amnt"

  test_path: 'data/alphabattle/test'
  train_path: 'data/alphabattle/train'
  val_ratio: 0.15
  num_workers: 4
  train_resamples: 1
  batch_size: 128

  min_history_len: 4
  generation_len: 4
  max_seq_len: 512
  padding_value: 0

  train_random_end: time
  val_random_end: time
  
  train_transforms: 
    "rescale_time":
      RescaleTime:
        loc: 0.0
        scale: 20
    "time_diff":
      TimeToDiff:
        disable: True
    "vr_decimal": null
    "3":
      CutTargetSequence:
        target_len: 0

  val_transforms:
    "rescale_time": ${data_conf.train_transforms.rescale_time}
    "time_diff": ${data_conf.train_transforms.time_diff}
    "vr_decimal": ${data_conf.train_transforms.vr_decimal}
    "3":
      CutTargetSequence:
        target_len: ${data_conf.generation_len}
