trainer:
  metrics_on_train: False
  grad_clip: 1

data_conf:
  train_transforms:
    "time_diff":
      TimeToDiff:
        disable: False
    "3":
      CutTargetSequence:
        target_len: ${data_conf.generation_len}

evaluator:
  topk: -1
  temperature: 1.

optimizer:
  name: AdamW
  params:
    lr: 1.e-4

loss:
  name: TargetLoss
  params:
    num_weight: 0.5
    num_loss: mae


model:
  name: OneShotGenerator
  autoencoder:
    name: BaselineAE
    params:
      cat_emb_dim: 8
      num_emb_dim: 8
      num_norm: True
      use_time: True
    pretrain: False
    frozen: False
    checkpoint:

  latent_encoder:
    name: GPT
    params:
      max_len: ${data_conf.max_seq_len}
      n_layer: 6
      n_head: 8
      n_embd: 512
      dropout: 0.1
      bias: True
  pooler: "last"
  params:
    gen_len: ${data_conf.generation_len}


optuna:
  params:
    n_trials: 100
    n_startup_trials: 10
    request_list: []
    target_metric: loss
  suggestions:
    - ["optimizer.params.weight_decay", ["suggest_float", {low: 1.e-15, high: 1.e-2, log: True}]]
    - ["optimizer.params.lr", ["suggest_float", {low: 1.e-5, high: 0.1, log: True}]]

    - ["model.latent_encoder.params.num_layers", [suggest_int, {low: 1, high: 10, log: False}]]
    - ["model.latent_encoder.params.scale_hidden", [suggest_int, {low: 1, high: 16, log: False}]]
    - ["model.latent_encoder.params.dropout", [suggest_float, {low: 0, high: 0.6, log: False}]]
    - ["model.latent_encoder.params.pos_dropout", [suggest_float, {low: 0, high: 0.6, log: False}]]
    - ["model.latent_encoder.params.pos_enc_type", [suggest_categorical, {choices: ["base", "cat", "learned", "none"]}]]
    - ["model.latent_encoder.params.num_heads", [suggest_categorical, {choices: [1, 2, 4, 8]}]]

    - ["model.pooler", ["suggest_categorical", {choices: ["last", "mean"]}]]

    - ["model.autoencoder.params.num_norm", ["suggest_categorical", {choices: [True, False]}]]
    - ["model.autoencoder.params.cat_emb_dim", [suggest_int, {low: 8, high: 128, log: False, step: 8}]]
    - ["model.autoencoder.params.num_emb_dim", [suggest_int, {low: 8, high: 128, log: False, step: 8}]]
