model:
  name: CrossDiffusionModel
  params:
    losses: ['time_loss', 'type_loss']
    history_len: ${data_conf.generation_len}
    generation_len: ${data_conf.generation_len}
    raw_history_cond: False
    # Model architecture params
    diffusion_steps: 500
    repeat_samples: 1
    num_emb_dim_features_exp: 3
    cat_emb_dim_features_exp: 3
    time_emb_dim_features_exp: 5
    dim_exp: 9
    heads_exp: 3
    hidden_scale_exp: 11
    encoder_layer: 6
    decoder_layer: 6
    num_diffusion_t_type: discrete
    cat_diffusion_t_type: discrete
    history_encoder_causal_mask: false
    use_rezero: true
    use_simple_time_proj: true
    use_post_norm: true
    prefix_dim_exp: 6
    cfg_p: 0.1
    cfg_w: 1.0
    history_encoder:
      name: AutoregressiveGenerator
      latent_encoder:
        name: GRU
        params:
          hidden_size: 512
          num_layers: 1
      autoencoder:
        name: BaselineAE
        params:
          cat_emb_dim: 8
          num_emb_dim: 8
          num_norm: true
          use_time: true
        pretrain: false
        frozen: False
        batch_transforms:
      pooler: last
      params: null
