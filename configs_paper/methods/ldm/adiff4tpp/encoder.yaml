model:
  name: LatentDiffusionGenerator
  latent_encoder:
    name: AsyncDiffEncoder 
    params:
      loss_type: l2-squared # l2,l2-squared and huber
      schedule: async
      int_ode: rk4
      generation_len: ${data_conf.generation_len}
      reference_len: ${data_conf.generation_len}
      denoiser_name: DiT # currently only DiT is supported
      hidden_size: 512 ## must be the times of laten_size
      depth: 6
      num_heads: 8
      mlp_ratio: 4
      data_init: False
      data_init_noisesigma: 0
  params:
    history_encoder:
      name: AutoregressiveGenerator
      latent_encoder:
        name: GRU
        params:
          hidden_size: 512
          num_layers: 1
      autoencoder:
        name: BaselineAE
        params:
          cat_emb_dim: 8
          num_emb_dim: 8
          num_norm: true
          use_time: true
        pretrain: false
        frozen: False
        batch_transforms:
      pooler: last
      params: null
