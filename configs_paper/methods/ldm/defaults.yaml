trainer:
  ckpt_track_metric: loss
  metrics_on_train: False
  ema_metrics_on_train: False
  total_iters: 1_000_000
  patience: 20
  patience_alpha: 0.1
  grad_clip: 1.
  ema:
    beta: 0.9999
    update_after_step: 70000
    update_every: 10
  val_loss_resamples: 50

data_conf:
  train_resamples: 25
  batch_size: 128
  train_transforms:
    "3":
      CutTargetSequence:
        target_len: ${data_conf.generation_len}

loss:
  name: DummyLoss