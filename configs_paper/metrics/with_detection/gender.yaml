evaluator:
  devices: 
   - ${device}
   - ${device}
   - ${device} # ALWAYS SET MORE THAN 1 DEVICE 
  metrics:
    - OTD
    - OTD: {focus_on: [amount]}
    - OTD: {focus_on: [event_time]}
    - OTD: {focus_on: [mcc_code]}
    - OTD: {focus_on: [tr_type]}
    - OTD: {max_shift: 0, focus_on: [amount]}
    - OTD: {max_shift: 0, focus_on: [event_time]}
    - OTD: {max_shift: 0, focus_on: [mcc_code]}
    - OTD: {max_shift: 0, focus_on: [tr_type]}
    - OTD: {"log_cols": ["amount"]}
    - OTD: {max_shift: 0, "log_cols": ["amount"]}
    - Cardinality
    - Density: {log_cols: ["amount"], with_timediff: False, save_details: True, verbose: False}
    - Visualization: {"log_amnt": True}
    - Detection:
        report_std: True
        condition_len: ${data_conf.generation_len}
        verbose: False
