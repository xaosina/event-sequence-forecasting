evaluator:
  devices: 
   - ${device}
   - ${device}
   - ${device} # ALWAYS SET MORE THAN 1 DEVICE 
  metrics:
    - OTD
    - OTD: {focus_on: [time_since_start]}
    - OTD: {focus_on: [type_event]}
    - OTD: {max_shift: 0, focus_on: [time_since_start]}
    - OTD: {max_shift: 0, focus_on: [type_event]}
    - Cardinality
    - Density: {with_timediff: False, save_details: True, verbose: False}
    - Visualization: {"log_amnt": False}
    - Detection:
        report_std: True
        condition_len: ${data_conf.generation_len}
        verbose: False
