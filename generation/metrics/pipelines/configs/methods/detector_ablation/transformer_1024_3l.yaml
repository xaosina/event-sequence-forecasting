method_name: transformer_1024_3l
runner_name: SupervisedRunner

loss:
  name: CrossEntropy

model:
  preprocess:
    name: Batch2Seq
    params:
      cat_cardinalities: ${cc}
      num_features: ${nn}
      cat_emb_dim: 16
      num_emb_dim: 16
      time_process: "cat"
      num_norm: false
  projection:
    name: Projection
    params:
      in_features: output_dim_from_prev
      out_features: 1024
  encoder:
    name: Transformer
    params:
      input_size: output_dim_from_prev
      max_len: ${data.preprocessing.common_pipeline.max_seq_len}
      num_layers: 3
      scale_hidden: 4
      dropout: 0.1
      pos_dropout: 0.1
      pos_enc_type: "base"
      num_heads: 8
  aggregation:
    name: TakeLastHidden
  head:
    name: nn.Linear
    params:
      in_features: output_dim_from_prev
      out_features: ${n_classes}

optimizer:
  name: Adam
  params:
    lr: 3.e-4
    weight_decay: 1.e-6

trainer:
  total_iters: 100_000
